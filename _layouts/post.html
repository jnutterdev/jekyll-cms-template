---
layout: default
---
<article class="container container--prose">
  <header class="post-header">
    <h1>{{ page.title | escape }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </p>
    {%- if page.tags.size > 0 %}
    {% include tag-list.html tags=page.tags %}
    {%- endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
