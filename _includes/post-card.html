{%- assign post = include.post -%}
<article class="post-card">
  <time class="meta" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %-d, %Y" }}</time>
  <h3 class="post-card__title"><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h3>
  <p class="post-card__excerpt">{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
  {%- if post.tags.size > 0 %}
  {% include tag-list.html tags=post.tags %}
  {%- endif %}
</article>
